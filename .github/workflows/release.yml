name: RobinHood Release

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    if: "!contains(github.ref, 'refs/tags')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
      version_code: ${{ steps.check_version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check_version
        run: |
          set -euo pipefail
          if [ ! -f app/build.gradle.kts ]; then
            echo "File app/build.gradle.kts does not exist"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_VERSION=$(grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")
          VERSION_CODE=$(grep -m1 -oP '^\s*versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "")

          if [ -z "$NEW_VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "Could not find versionName/versionCode in app/build.gradle.kts"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "versionName must use MAJOR.MINOR.PATCH.BUILD (for example 1.0.0.0), got: $NEW_VERSION"
            exit 1
          fi

          echo "Current version: $NEW_VERSION (code: $VERSION_CODE)"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual release requested for version $NEW_VERSION"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git show HEAD^:app/build.gradle.kts > /dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^:app/build.gradle.kts | grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' || echo "")
            echo "Previous version: $OLD_VERSION"
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "Version changed from $OLD_VERSION to $NEW_VERSION"
              echo "version_changed=true" >> "$GITHUB_OUTPUT"
              echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
              echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
            else
              echo "Version unchanged: $NEW_VERSION"
              echo "version_changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "First version detected: $NEW_VERSION"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug output
        run: |
          echo "Debug Information:"
          echo "  - version_changed: ${{ steps.check_version.outputs.version_changed }}"
          echo "  - new_version: ${{ steps.check_version.outputs.new_version }}"
          echo "  - version_code: ${{ steps.check_version.outputs.version_code }}"
          echo "  - event_name: ${{ github.event_name }}"

  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - variant: foss
            variantName: Foss
          - variant: gms
            variantName: Gms
          - variant: izzy
            variantName: Izzy
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          test -s app/keystore/release.keystore
      - name: Build Release APK
        run: ./gradlew --console=plain assemble${{ matrix.variantName }}Release --warning-mode summary
        env:
          ROBINHOOD_APPLICATION_ID: com.robinhood.music
          ROBINHOOD_APP_NAME: RobinHood
          ROBINHOOD_RELEASE_KEYSTORE_PATH: keystore/release.keystore
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      - name: Move and rename signed APKs
        run: |
          set -euo pipefail
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "$OUTPUT_DIR/out"
          SIGNED_APK=$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name "*.apk" | head -1)
          if [ -z "$SIGNED_APK" ]; then
            echo "No signed APK found for ${{ matrix.variant }}"
            ls -la "$OUTPUT_DIR"
            exit 1
          fi
          if [ "${{ matrix.variant }}" = "gms" ]; then
            TARGET_NAME="RobinHood-with-Google-Cast.apk"
          elif [ "${{ matrix.variant }}" = "izzy" ]; then
            TARGET_NAME="RobinHood-izzy.apk"
          else
            TARGET_NAME="RobinHood.apk"
          fi
          mv "$SIGNED_APK" "$OUTPUT_DIR/out/$TARGET_NAME"
          echo "APK renamed to: $TARGET_NAME"
          ls -la "$OUTPUT_DIR/out/"
      - name: Upload Signed APKs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.variant == 'gms' && 'RobinHood-with-Google-Cast' || matrix.variant == 'izzy' && 'RobinHood-izzy' || 'RobinHood' }}
          path: app/build/outputs/apk/${{ matrix.variant }}/release/out/*.apk

  create-release:
    needs: [check-version, build]
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all APKs
        uses: actions/download-artifact@v7
        with:
          path: downloaded_artifacts/
      - name: Organize APKs for release
        run: |
          set -euo pipefail
          mkdir -p release_files
          find downloaded_artifacts -name "*.apk" -exec cp {} release_files/ \;
          echo "APKs ready for release:"
          ls -la release_files/
      - name: Create source archives
        env:
          VERSION: ${{ needs.check-version.outputs.new_version }}
        run: |
          set -euo pipefail
          ZIP_FILE="Source code.zip"
          TAR_FILE="Source code.tar.gz"
          git archive --format=zip --prefix="RobinHood-${VERSION}/" HEAD -o "$ZIP_FILE"
          git archive --format=tar --prefix="RobinHood-${VERSION}/" HEAD | gzip -9 > "$TAR_FILE"
          mv "$ZIP_FILE" "$TAR_FILE" release_files/
      - name: Parse release notes from changelog
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          chmod +x .github/scripts/parse_changelog.sh
          if bash .github/scripts/parse_changelog.sh "$VERSION" changelog.md > release_notes.md; then
            echo "Release notes sourced from changelog.md for v$VERSION"
          else
            echo "::warning::v$VERSION not found in changelog.md — falling back to git log"
            {
              echo "Release of version $VERSION"
              echo ""
              git log "$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~10")..HEAD" --pretty=format:"- %s" --no-merges | head -10 || echo "- Initial release"
            } > release_notes.md
          fi
      - name: Validate release version and tag
        env:
          VERSION: ${{ needs.check-version.outputs.new_version }}
          VERSION_CODE: ${{ needs.check-version.outputs.version_code }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="v${VERSION}"
          echo "Expected release tag: $EXPECTED_TAG"
          echo "Android versionName: $VERSION"
          echo "Android versionCode: $VERSION_CODE"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          if [[ "$VERSION_CODE" -lt 1 ]]; then
            echo "versionCode must be >= 1"
            exit 1
          fi

          if [[ "$EXPECTED_TAG" != "v${VERSION}" ]]; then
            echo "Release tag mismatch"
            exit 1
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.new_version }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v${VERSION}"

          # Never mutate the requested release tag. A collision is an error,
          # because silently creating vX.Y.Z.B+1 produces an APK/tag mismatch.
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Refusing to create a mismatched release."
            exit 1
          fi

          if gh api "repos/${{ github.repository }}/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists. Refusing to create a release from a reused tag."
            exit 1
          fi

          {
            echo "Released by @${{ github.triggering_actor }}"
            echo ""
            cat release_notes.md
            echo ""
            echo "## Version"
            echo "- App version: v${VERSION}"
            echo "- Android versionCode: ${{ needs.check-version.outputs.version_code }}"
            echo "- Release tag: $RELEASE_TAG"
            echo ""
            echo "## Downloads"
            echo "- RobinHood.apk — FOSS build"
            echo "- RobinHood-with-Google-Cast.apk — Google Cast build"
            echo "- RobinHood-izzy.apk — IzzyOnDroid-compatible build"
            echo "- Source code.zip — source archive"
            echo "- Source code.tar.gz — source archive"
          } > attributed_release_notes.md

          gh release create "$RELEASE_TAG" \
            --title "RobinHood $RELEASE_TAG" \
            --notes-file attributed_release_notes.md \
            --latest \
            --target "${GITHUB_SHA}" \
            release_files/*.apk \
            "release_files/Source code.zip" \
            "release_files/Source code.tar.gz"

          echo "Release created successfully: $RELEASE_TAG"

      - name: Update release summary
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: v${{ needs.check-version.outputs.new_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version Code**: ${{ needs.check-version.outputs.version_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Tag**: v${{ needs.check-version.outputs.new_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Released by**: @${{ github.triggering_actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Files built**: $(find release_files -maxdepth 1 -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release URL**: https://github.com/${{ github.repository }}/releases" >> "$GITHUB_STEP_SUMMARY"
